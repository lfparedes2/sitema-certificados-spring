server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: "strict"

spring:
  config:
    import: "file:./config/application-secrets.properties"
  application:
    name: modulo-seguridad-avanzado

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      # Fuerza a Spring Boot a inicializar los scripts siempre
      mode: always

  jpa:
    # 1. Propiedad clave: Retrasa el data.sql hasta que Hibernate cree las tablas
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: seguridad
        # Crea el esquema automáticamente en Postgres si no existe
        javax.persistence.create-database-schemas: true
  mail:
    host: ://tudominio.com
    port: 587
    username: MAIL_USERNAME
    password: MAIL_PASSWORD
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    org.springframework.security: INFO

# ==========================================
# CONFIGURACIÓN DE SEGURIDAD CUSTOM
# ==========================================
seguridad:
  password:
    # Cambia a 'false' para apagar la validación de caducidad en caliente (sin recompilar)
    validar-caducidad: true
  2fa:
    # Cambia a 'false' para deshabilitar el código de 4 dígitos
    habilitado: false

google:
  recaptcha:
    secret: ${GOOGLE_RECAPTCHA_SECRET}
    public: ${GOOGLE_RECAPTCHA_PUBLIC}
    verify:
      url: ${GOOGLE_RECAPTCHA_VERIFY_URL}