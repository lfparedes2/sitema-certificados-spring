server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: "strict"

spring:
  application:
    name: modulo-seguridad-avanzado

  datasource:
    url: jdbc:postgresql://localhost:5432/uafe_dasboard
    username: postgres
    password: sistemas
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      # Fuerza a Spring Boot a inicializar los scripts siempre
      mode: always

  jpa:
    # 1. Propiedad clave: Retrasa el data.sql hasta que Hibernate cree las tablas
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: seguridad
        # Crea el esquema automáticamente en Postgres si no existe
        javax.persistence.create-database-schemas: true

logging:
  level:
    org.springframework.security: INFO

# ==========================================
# CONFIGURACIÓN DE SEGURIDAD CUSTOM
# ==========================================
seguridad:
  password:
    # Cambia a 'false' para apagar la validación de caducidad en caliente (sin recompilar)
    validar-caducidad: false