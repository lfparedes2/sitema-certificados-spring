<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<body>

<!-- Modal adaptado a Flowbite (z-40 para que el #global-loader quede siempre encima) -->
<!-- Cambia la etiqueta de apertura de tu modal por esta -->
<div th:fragment="modalSolicitud"
     id="modalSolicitud"
     tabindex="-1"
     aria-hidden="true"
     data-modal-backdrop="static"
     style="z-index: 50;"
     class="hidden overflow-y-auto overflow-x-hidden fixed inset-0 justify-center items-center w-full h-full bg-slate-900/75 backdrop-blur-sm p-4">


    <div class="relative w-full max-w-md max-h-full animate__animated animate__zoomIn animate__faster">
        <!-- Contenedor visual idéntico al que tenías -->
        <div class="relative rounded-3xl bg-gradient-to-b from-white via-slate-50 to-slate-100 p-6 sm:p-8 shadow-2xl border border-white/80">

            <!-- Encabezado -->
            <div class="relative flex items-center justify-center pb-4 border-b border-slate-200/80">
                <h3 class="text-xl font-bold text-slate-900 tracking-tight">Registrar Solicitud</h3>
                <button type="button"
                        aria-label="Cerrar ventana"
                        data-modal-hide="modalSolicitud"
                        onclick="resetearFormulario(document.getElementById('modalSolicitud'))"
                        class="absolute right-0 rounded-full p-1.5 text-slate-400 hover:bg-slate-200/70 hover:text-slate-700 transition-colors focus:outline-none">
                    <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
                         class="h-5 w-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Formulario -->
            <form id="formSolicitud"
                  data-validar
                  th:action="@{/solicitudes/guardar}"
                  hx-post="/solicitudes/guardar"
                  hx-target="#tabla-solicitudes"
                  hx-swap="innerHTML"
                  hx-on::after-request="if(event.detail.successful) { this.reset(); document.querySelector('[data-modal-hide=\'modalSolicitud\']').click(); }"
                  method="post"
                  hx-disabled-elt="find button[type='submit']"
                  class="mt-6 space-y-5">

                <!-- Alerta de errores generales del backend -->
                <div data-error-general
                     class="hidden rounded-xl border border-red-200 bg-red-50 p-3 text-xs font-medium text-red-700 flex items-center gap-2">
                </div>

                <!-- Campo Nombre -->
                <div class="group">
                    <label for="inputNombre"
                           class="block text-xs font-bold uppercase tracking-wider text-slate-600 transition-colors group-focus-within:text-blue-600">
                        Nombre <span class="text-red-500">*</span>
                    </label>
                    <div data-caja
                         class="mt-1.5 flex items-center rounded-xl border border-slate-300 bg-white px-3.5 shadow-sm transition-all group-focus-within:border-blue-600 group-focus-within:ring-4 group-focus-within:ring-blue-600/10">
                        <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                             stroke="currentColor"
                             class="h-5 w-5 text-slate-400 shrink-0 mr-2.5 transition-colors group-focus-within:text-blue-600">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
                        </svg>
                        <input id="inputNombre" type="text" name="nombre"
                               required minlength="3" maxlength="80"
                               data-msg-required="El nombre de la solicitud es obligatorio."
                               data-msg-minlength="El nombre debe tener al menos 3 caracteres."
                               autocomplete="off"
                               placeholder="Ej. Solicitud de acceso al sistema"
                               class="w-full border-0 bg-transparent py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none">
                    </div>
                </div>

                <!-- Campo Descripción -->
                <div class="group">
                    <label for="inputDescripcion"
                           class="block text-xs font-bold uppercase tracking-wider text-slate-600 transition-colors group-focus-within:text-blue-600">
                        Descripción <span class="text-red-500">*</span>
                    </label>
                    <div data-caja
                         class="mt-1.5 flex items-start rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 shadow-sm transition-all group-focus-within:border-blue-600 group-focus-within:ring-4 group-focus-within:ring-blue-600/10">
                        <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                             stroke="currentColor"
                             class="h-5 w-5 text-slate-400 shrink-0 mr-2.5 mt-0.5 transition-colors group-focus-within:text-blue-600">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
                        </svg>
                        <textarea id="inputDescripcion" name="descripcion" rows="3"
                                  required minlength="10" maxlength="250"
                                  data-msg-required="La descripción es obligatoria."
                                  data-msg-minlength="Detalla un poco más (mínimo 10 caracteres)."
                                  placeholder="Detalla el motivo o alcance de la solicitud..."
                                  class="w-full resize-none border-0 bg-transparent text-sm text-slate-900 placeholder-slate-400 focus:outline-none"></textarea>
                    </div>
                </div>

                <!-- Botones -->
                <div class="mt-7 grid grid-cols-2 gap-3 pt-4 border-t border-slate-200/80">
                    <button type="button"
                            data-modal-hide="modalSolicitud"
                            onclick="resetearFormulario(document.getElementById('modalSolicitud'))"
                            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-xs font-bold tracking-wide text-slate-700 shadow-sm hover:bg-slate-50 active:bg-slate-100 transition-colors">
                        Cancelar
                    </button>
                    <button type="submit"
                            class="group relative overflow-hidden w-full py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold tracking-wide shadow-md hover:bg-blue-700 active:bg-blue-800 transition-colors flex items-center justify-center gap-1.5">
                        <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2"
                             stroke="currentColor"
                             class="w-4 h-4 relative z-10">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
                        </svg>
                        <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/30 to-transparent -translate-x-full group-hover:translate-x-full group-active:translate-x-full transition-transform duration-700 ease-in-out"></span>
                        <span class="relative z-10">Guardar</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
