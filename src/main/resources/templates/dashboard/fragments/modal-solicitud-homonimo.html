<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<body>

<dialog th:fragment="modalSolicitud"
        id="modalSolicitud"
        class="animate__animated animate__zoomIn animate__faster m-auto w-full max-w-md rounded-2xl bg-white p-0 shadow-2xl border border-gray-100 backdrop:bg-gray-900/80 backdrop:backdrop-blur-sm">

    <div class="p-6 sm:p-8">
        <!-- Encabezado -->
        <div class="flex items-center justify-between border-b border-gray-200 pb-4">
            <h3 class="text-lg font-semibold text-gray-900">Registrar Solicitud</h3>
            <button type="button"
                    onclick="document.getElementById('modalSolicitud').close()"
                    class="rounded-lg p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600">
                ✕
            </button>
        </div>

        <!-- Formulario HTML puro -->
        <form action="#" method="post" class="mt-5 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-900">Nombre</label>
                <input type="text" name="nombre" required
                       class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-600 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-900">Descripción</label>
                <input type="text" name="descripcion" required
                       class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-600 focus:outline-none">
            </div>

            <div class="mt-6 flex justify-end gap-3 border-t border-gray-200 pt-4">
                <button type="button"
                        onclick="document.getElementById('modalSolicitud').close()"
                        class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">
                    Cancelar
                </button>
                <button type="submit"
                        class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">
                    Guardar
                </button>
            </div>
        </form>
    </div>
</dialog>

</body>
</html>
