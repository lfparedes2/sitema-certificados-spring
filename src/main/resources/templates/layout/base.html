<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org" th:fragment="pagina(contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAFE - Gestión de Certificados</title>

    <!-- Puente de datos entre Thymeleaf y main.js -->
    <div id="alerta-data"
         th:if="${alertaNotificacion != null}"
         th:data-tipo="${alertaNotificacion.tipo}"
         th:data-titulo="${alertaNotificacion.titulo}"
         th:data-mensaje="${alertaNotificacion.mensaje}"
         th:data-tiempo="${alertaNotificacion.tiempo}"
         th:data-color="${alertaNotificacion.colorBoton}"
         hidden>
    </div>
    <!-- 1. Importar el CSS (Opcional) -->
    <link th:href="@{/css/sweetalert2.min.css}" rel="stylesheet">
    <!-- 2. Importar el JavaScript de SweetAlert2 -->
    <script th:src="@{/js/sweetalert2.all.min.js}"></script>
    <script th:src="@{/js/main.js}"></script>
    <link th:href="@{/css/output.css}" rel="stylesheet">
    <link th:href="@{/css/animate.min.css}" rel="stylesheet">
    <link rel="icon"  th:href="@{/images/favico.png}">
</head>
<body class="bg-gray-50 font-sans text-gray-900 antialiased">

<!-- ========================================== -->
<!-- HEADER: Cabecera y Menú Fijo Superior     -->
<!-- ========================================== -->
<div class="fixed top-0 left-0 right-0 z-50">
    <!-- Primer Nav: Cabecera de Usuario -->
    <nav class="bg-white shadow-sm border-b border-gray-200 px-6 py-3 flex justify-between items-center" aria-label="Cabecera principal de usuario">
        <div class="flex items-center gap-4">
            <div class="text-2xl font-black tracking-tight text-blue-800">UAFE</div>
            <div class="h-6 w-px bg-gray-300 mx-2"></div>
            <span class="text-sm text-gray-500 font-semibold tracking-wide">Dashboard de Trámites</span>
        </div>

        <div class="flex items-center gap-6">
            <!-- Identificación del Operador -->
            <div class="flex items-center gap-3 bg-gray-100/80 border border-gray-200/40 px-3 py-1.5 rounded-full shadow-sm">
                <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white text-xs font-black uppercase shadow-inner"
                     th:text="${#strings.substring(user.nombre,0,2)}">
                </div>
                <div class="text-xs">
                    <p class="font-bold leading-tight uppercase text-gray-800" th:text="${user.nombre}"></p>
                    <p class="text-green-600 flex items-center gap-1 font-medium mt-0.5">
                        ● <span class="text-gray-500 font-semibold tracking-wider text-[10px]" th:text="${user.tipo}">En línea</span>
                    </p>
                </div>
            </div>

            <!-- Botón Salir -->
            <form th:action="@{/auth/logout}" method="POST" class="inline">
                <button type="submit" class="inline-flex items-center gap-2 text-red-500 hover:text-red-700 text-sm font-bold transition-colors bg-transparent border-0 p-0 cursor-pointer focus:outline-none">
                    <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15" />
                    </svg>
                    <span>Salir</span>
                </button>
            </form>
        </div>
    </nav>

    <!-- Segundo Nav: Menú Jerárquico Infinito y Responsive -->
    <nav class="bg-white/95 backdrop-blur-md text-gray-700 shadow-sm border-b border-gray-200/80 sticky top-0 z-40">
        <div class="px-4 md:px-6 py-2.5 flex items-center justify-between">

            <!-- Botón Hamburguesa (Solo visible en Móvil) -->
            <button id="mobile-menu-btn" type="button" onclick="toggleMobileNav()"
                    class="md:hidden flex items-center space-x-2.5 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100/80 hover:text-gray-900 transition-colors focus:outline-none">
                <svg class="w-6 h-6 transition-transform duration-300" id="icon-hamburger" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
                <svg class="w-6 h-6 hidden transition-transform duration-300" id="icon-close" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
                <span class="font-semibold text-sm tracking-wide">Menú</span>
            </button>

            <!-- MENÚ ESCRITORIO (Oculto en móvil, visible desde md) -->
            <ul class="hidden md:flex flex-wrap gap-2 items-center w-full">
                <li th:each="menu : ${user.menus}" th:if="${menu.idMenuPadre == null}" class="relative group">
                    <th:block th:with="hijos=${#lists.toList(user.menus).?[idMenuPadre == __${menu.idMenu}__]}">

                        <!-- Ítem Padre Escritorio -->
                        <div th:if="${not #lists.isEmpty(hijos)}"
                             class="relative overflow-hidden flex items-center space-x-2 cursor-pointer px-3.5 py-2.5 rounded-lg text-gray-700 hover:text-gray-900 hover:bg-gray-100/70 transition-all duration-200 select-none">
                            <div class="w-5 h-5 flex items-center justify-center text-gray-500 group-hover:text-gray-800 group-hover:scale-105 transition-all duration-200"
                                 th:utext="${menu.img}"></div>
                            <span class="font-medium text-sm tracking-wide" th:text="${menu.etiqueta}">Padre</span>
                            <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor"
                                 class="w-3.5 h-3.5 text-gray-400 group-hover:text-gray-700 transition-transform duration-300 ease-out group-hover:rotate-180">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                            </svg>

                            <!-- Barra de Carga Inferior Plomo Oscuro -->
                            <span class="absolute bottom-0 left-0 h-[2px] w-0 bg-gradient-to-r from-slate-700 via-gray-600 to-gray-400 group-hover:w-full transition-all duration-400 ease-out rounded-full"></span>
                        </div>

                        <!-- Ítem Enlace Directo Escritorio -->
                        <a th:if="${#lists.isEmpty(hijos)}"
                           th:href="@{{path}(path=${menu.accion})}"
                           class="relative overflow-hidden flex items-center space-x-2 px-3.5 py-2.5 rounded-lg text-gray-700 hover:text-gray-900 hover:bg-gray-100/70 transition-all duration-200 group/link">

                            <!-- Efecto Destello (Shimmer) neutro suave -->
                            <span class="absolute inset-0 -translate-x-full group-hover/link:translate-x-full transition-transform duration-700 ease-in-out bg-gradient-to-r from-transparent via-gray-200/40 to-transparent pointer-events-none"></span>

                            <div class="w-5 h-5 flex items-center justify-center text-gray-500 group-hover/link:text-gray-800 group-hover/link:scale-105 transition-all duration-200"
                                 th:utext="${menu.img}"></div>
                            <span class="font-medium text-sm tracking-wide" th:text="${menu.etiqueta}">Enlace</span>

                            <!-- Barra de Carga Inferior Plomo Oscuro -->
                            <span class="absolute bottom-0 left-0 h-[2px] w-0 bg-gradient-to-r from-slate-700 via-gray-600 to-gray-400 group-hover/link:w-full transition-all duration-400 ease-out rounded-full"></span>
                        </a>

                        <!-- Desplegable Nivel 1 Escritorio -->
                        <div th:if="${not #lists.isEmpty(hijos)}"
                             class="absolute left-0 top-full pt-2 z-50 invisible opacity-0 translate-y-2 scale-95 group-hover:visible group-hover:opacity-100 group-hover:translate-y-0 group-hover:scale-100 transition-all duration-200 ease-out origin-top-left">
                            <ul th:replace="~{::renderSubmenus(listaHijos=${hijos}, todosLosMenus=${user.menus})}"></ul>
                        </div>

                    </th:block>
                </li>
            </ul>
        </div>

        <!-- MENÚ MÓVIL DESPLEGABLE (Acordeón Recursivo) -->
        <div id="mobile-nav-drawer" class="hidden md:hidden border-t border-gray-100 bg-white max-h-[75vh] overflow-y-auto px-4 py-3 shadow-inner space-y-1">
            <th:block th:replace="~{::renderMobileSubmenus(listaHijos=${#lists.toList(user.menus).?[idMenuPadre == null]}, todosLosMenus=${user.menus})}"></th:block>
        </div>
    </nav>
</div>
<!-- FRAGMENTO 1: Submenús Recursivos para ESCRITORIO -->
<ul th:fragment="renderSubmenus(listaHijos, todosLosMenus)"
    class="bg-white/95 backdrop-blur-md border border-gray-200/90 rounded-xl shadow-lg shadow-gray-200/40 min-w-[235px] p-1.5 space-y-1">

    <li th:each="sub : ${listaHijos}" class="relative group/sub">
        <th:block th:with="nietos=${#lists.toList(todosLosMenus).?[idMenuPadre == __${sub.idMenu}__]}">

            <!-- Submenú con hijos -->
            <div th:if="${not #lists.isEmpty(nietos)}"
                 class="relative overflow-hidden flex items-center justify-between w-full px-3 py-2 text-sm text-gray-700 rounded-lg hover:bg-gray-100/80 hover:text-gray-900 cursor-pointer whitespace-nowrap transition-all duration-150 group/item">
                <div class="flex items-center space-x-3">
                    <div class="w-4 h-4 flex items-center justify-center text-gray-400 group-hover/item:text-gray-700 group-hover/item:scale-105 transition-all duration-200"
                         th:utext="${sub.img}"></div>
                    <span class="font-medium group-hover/item:translate-x-0.5 transition-transform duration-150" th:text="${sub.etiqueta}">Submenú</span>
                </div>
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
                     class="w-3.5 h-3.5 text-gray-400 group-hover/item:text-gray-700 group-hover/item:translate-x-1 transition-all duration-200">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                </svg>

                <!-- Barra de Carga Inferior Plomo en Submenú -->
                <span class="absolute bottom-0 left-0 h-[1.5px] w-0 bg-gradient-to-r from-slate-600/85 to-gray-400/60 group-hover/item:w-full transition-all duration-300 ease-out"></span>
            </div>

            <!-- Submenú Final (Enlace) -->
            <a th:if="${#lists.isEmpty(nietos)}"
               th:href="@{{path}(path=${sub.accion})}"
               class="relative overflow-hidden flex items-center space-x-3 px-3 py-2 text-sm text-gray-700 rounded-lg hover:bg-gray-100/80 hover:text-gray-900 whitespace-nowrap transition-all duration-150 group/item">
                <div class="w-4 h-4 flex items-center justify-center text-gray-400 group-hover/item:text-gray-700 group-hover/item:scale-105 transition-all duration-200"
                     th:utext="${sub.img}"></div>
                <span class="group-hover/item:translate-x-0.5 transition-transform duration-150" th:text="${sub.etiqueta}">Submenú Final</span>

                <!-- Barra de Carga Inferior Plomo en Submenú -->
                <span class="absolute bottom-0 left-0 h-[1.5px] w-0 bg-gradient-to-r from-slate-600/85 to-gray-400/60 group-hover/item:w-full transition-all duration-300 ease-out"></span>
            </a>

            <!-- Contenedor Desplegable Recursivo -->
            <div th:if="${not #lists.isEmpty(nietos)}"
                 class="absolute left-full top-0 pl-1.5 z-50 invisible opacity-0 -translate-x-2 scale-95 group-hover/sub:visible group-hover/sub:opacity-100 group-hover/sub:translate-x-0 group-hover/sub:scale-100 transition-all duration-200 ease-out origin-top-left">
                <ul th:replace="~{::renderSubmenus(listaHijos=${nietos}, todosLosMenus=${todosLosMenus})}"></ul>
            </div>

        </th:block>
    </li>
</ul>

<!-- FRAGMENTO 2: Acordeón Recursivo para MÓVIL -->
<th:block th:fragment="renderMobileSubmenus(listaHijos, todosLosMenus)">
    <div th:each="item : ${listaHijos}" class="w-full">
        <th:block th:with="subHijos=${#lists.toList(todosLosMenus).?[idMenuPadre == __${item.idMenu}__]}">

            <!-- Ítem Móvil con Submenús (Acordeón) -->
            <div th:if="${not #lists.isEmpty(subHijos)}" class="rounded-lg overflow-hidden">
                <button type="button" onclick="toggleAccordion(this)"
                        class="w-full flex items-center justify-between px-3 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-100/80 hover:text-gray-900 rounded-lg transition-colors">
                    <div class="flex items-center space-x-3">
                        <div class="w-5 h-5 flex items-center justify-center text-gray-500" th:utext="${item.img}"></div>
                        <span th:text="${item.etiqueta}">Categoría Móvil</span>
                    </div>
                    <svg class="w-4 h-4 text-gray-400 transition-transform duration-300 accordion-arrow" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                    </svg>
                </button>
                <div class="hidden pl-4 ml-3.5 border-l border-gray-300 space-y-1 mt-1">
                    <th:block th:replace="~{::renderMobileSubmenus(listaHijos=${subHijos}, todosLosMenus=${todosLosMenus})}"></th:block>
                </div>
            </div>

            <!-- Ítem Móvil Final (Enlace) -->
            <a th:if="${#lists.isEmpty(subHijos)}"
               th:href="@{{path}(path=${item.accion})}"
               class="flex items-center space-x-3 px-3 py-2.5 text-sm text-gray-600 hover:bg-gray-100/80 hover:text-gray-900 rounded-lg transition-colors">
                <div class="w-5 h-5 flex items-center justify-center text-gray-400" th:utext="${item.img}"></div>
                <span th:text="${item.etiqueta}">Enlace Móvil</span>
            </a>

        </th:block>
    </div>
</th:block>

<!-- Espaciador Obligatorio de la Cabecera Fija -->
<div class="h-[125px]"></div>

<!-- ========================================== -->
<!-- CONTENIDO DINÁMICO (Inyectado por la vista)-->
<!-- ========================================== -->
<main class="flex-grow max-w-full w-full mx-auto p-6 animate__animated animate__fadeIn animate__repeat-1">
    <!-- Banner Condicional de Notificación de Errores -->
    <!--<div th:if="${errorStatus}" class="bg-red-50 border-l-4 border-red-500 p-4 rounded-xl mb-6 shadow-sm border border-red-100" role="alert">
        <div class="flex flex-col">
            <h3 class="text-sm font-bold text-red-900" th:text="${errorStatus}">Código Error</h3>
            <div class="text-xs text-red-700 mt-1 font-medium" th:text="${errorMessage}">Mensaje aclaratorio del fallo de validación de Spring.</div>
        </div>
    </div>-->

    <!-- Thymeleaf reemplazará este fragmento con el bloque que envíe la página hija -->
    <th:block th:replace="${contenido}"></th:block>
</main>

<!-- ========================================== -->
<!-- FOOTER: Pie de página institucional        -->
<!-- ========================================== -->
<footer class="bg-white border-t border-gray-200 mt-auto py-4 px-6 text-center text-xs text-gray-400 font-medium">
    <div>© 2026 UAFE - Unidad de Análisis Financiero y Económico. Todos los derechos reservados.</div>
</footer>

</body>
</html>
